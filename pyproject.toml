[project]
name = "elja"
version = "0.2.0"
description = "A relentless, fully-customizable LLM agent harness built on Pydantic AI. Under active development."
authors = [{ name = "Ben Ballintyn", email = "benballintyn@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai-slim[openai,mcp] (>=2.36,<3)",
    "pydantic-settings (>=2.0,<3)",
    "loguru (>=0.7,<1)",
    "rich (>=15.0.0,<16.0.0)",
    "fastmcp (>=3,<4)",
    "ddgs (>=9,<10)",
]

[project.scripts]
elja = "elja.cli:main"

[project.urls]
Repository = "https://github.com/benballintyn/elja"

[tool.poetry]
packages = [{ include = "elja", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
pytest-asyncio = "^1.0"
ruff = "^0.15"
mypy = "^1.14"
pre-commit = "^4.0"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=elja --cov-report=term-missing -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: tests that need a live external service - LLM endpoint or internet (deselected in CI)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
