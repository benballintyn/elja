[project]
name = "elja"
version = "0.4.0"
description = "A relentless, fully-customizable LLM agent harness built on Pydantic AI. Under active development."
authors = [{ name = "Ben Ballintyn", email = "benballintyn@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai-slim[openai,mcp] (>=2.36,<3)",
    "pydantic-settings (>=2.0,<3)",
    "loguru (>=0.7,<1)",
    "rich (>=15.0.0,<16.0.0)",
    "fastmcp (>=3,<4)",
    "ddgs (>=9,<10)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pydantic-ai-harness (>=0.27,<0.28)",
]

[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic] (>=2.36,<3)"]
google = ["pydantic-ai-slim[google] (>=2.36,<3)"]

[project.scripts]
elja = "elja.cli:main"

[project.urls]
Repository = "https://github.com/benballintyn/elja"

[tool.poetry]
packages = [{ include = "elja", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
pytest-asyncio = "^1.0"
ruff = "^0.15"
mypy = "^1.14"
pre-commit = "^4.0"
types-pyyaml = "^6.0.12.20260815"
pydantic-ai-slim = {version = ">=2.36,<3", extras = ["anthropic", "google"]}

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The 100% floor lives on the CI command line, NOT here: in addopts it reddens
# every subset run — a single file, any -k, --lf, an IDE's run-this-test button,
# and the `pytest -m integration` command AGENTS.md documents — because a subset
# cannot reach 100%. CI is where it has to hold.
# If you ever need to exempt a line pattern, use `exclude_also` under
# [tool.coverage.report] — `exclude_lines` REPLACES coverage's defaults and would
# silently disable every `# pragma: no cover` in the tree, which matters now the
# 100% floor is enforced. There is nothing to exempt today: `if TYPE_CHECKING:` is
# already a coverage default and no `raise NotImplementedError` exists in src/.
# examples/ is measured too: it is the documented host integration, and three of
# its branches sat unexecuted behind a coverage scope that stopped at src/.
addopts = "--cov=src/elja --cov=examples --cov-report=term-missing -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: tests that need a live external service - LLM endpoint or internet (deselected in CI)",
]

[tool.mypy]
python_version = "3.11"
strict = true
# examples/ is type-checked and lint-checked too: it is the documented host
# integration, so it has to stay correct against a pinned-range dependency rather
# than rot quietly.
files = ["src", "tests", "examples"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
